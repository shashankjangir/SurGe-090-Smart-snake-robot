<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 950" width="100%">
  <title>Smart Snake Robot — System Architecture (ESP32 Onboard + Pi Base Station)</title>
  <desc>Complete electrical system showing dual LiPo, Bus Servo Adapter, onboard ESP32, 10-servo daisy chain, sensors, and ESP-NOW link to Raspberry Pi 5 base station</desc>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333"/>
    </marker>
    <marker id="arrowhead-wireless" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#7d5ba6"/>
    </marker>
    <style>
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #1a1a2e; }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #666; }
      .label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #333; }
      .spec { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #555; }
      .connection-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; font-weight: 500; fill: #444; }
      .legend { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #666; }
      @media (prefers-color-scheme: dark) {
        .title { fill: #e8e8f0; } .label { fill: #ddd; } .spec { fill: #bbb; } .connection-label { fill: #ccc; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="950" fill="#fafaf7"/>

  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" class="title">Snake Robot — Electrical Architecture</text>
  <text x="500" y="46" text-anchor="middle" class="subtitle">10× ST3215 servos · Dual 3S LiPo · ESP32 on robot · ESP-NOW to Pi 5 base station</text>

  <!-- ============ ONBOARD ROBOT SECTION ============ -->
  <g id="robot-section">
    <!-- Background frame for robot -->
    <rect x="20" y="70" width="480" height="850" rx="12" fill="#f5f5f0" stroke="#c5c5d0" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="40" y="95" class="label" font-weight="700" fill="#6b6b7b">ON THE ROBOT</text>

    <!-- Battery Pack A -->
    <rect x="35" y="115" width="110" height="100" rx="8" fill="#fdecea" stroke="#d1495b" stroke-width="2"/>
    <text x="90" y="140" text-anchor="middle" class="label" fill="#8f1f30">3S LiPo</text>
    <text x="90" y="157" text-anchor="middle" class="spec" fill="#8f1f30">Pack A</text>
    <text x="90" y="172" text-anchor="middle" class="spec" fill="#8f1f30">1500 mAh</text>
    <text x="90" y="187" text-anchor="middle" class="spec" fill="#8f1f30">30C · XT60</text>
    <text x="90" y="205" text-anchor="middle" class="spec" fill="#d99a2b">LV alarm</text>

    <!-- Battery Pack B -->
    <rect x="160" y="115" width="110" height="100" rx="8" fill="#fdecea" stroke="#d1495b" stroke-width="2"/>
    <text x="215" y="140" text-anchor="middle" class="label" fill="#8f1f30">3S LiPo</text>
    <text x="215" y="157" text-anchor="middle" class="spec" fill="#8f1f30">Pack B</text>
    <text x="215" y="172" text-anchor="middle" class="spec" fill="#8f1f30">1500 mAh</text>
    <text x="215" y="187" text-anchor="middle" class="spec" fill="#8f1f30">30C · XT60</text>
    <text x="215" y="205" text-anchor="middle" class="spec" fill="#d99a2b">LV alarm</text>

    <!-- Bus Servo Driver -->
    <rect x="35" y="240" width="150" height="115" rx="8" fill="#e8f1fb" stroke="#2274a5" stroke-width="2.5"/>
    <text x="112" y="268" text-anchor="middle" class="label" fill="#14496b" font-weight="700">Bus Servo</text>
    <text x="112" y="284" text-anchor="middle" class="label" fill="#14496b" font-weight="700">Adapter (A)</text>
    <text x="112" y="303" text-anchor="middle" class="spec" fill="#14496b">Waveshare 25514</text>
    <text x="112" y="318" text-anchor="middle" class="spec" fill="#14496b">Input 9–12.6V</text>
    <text x="112" y="333" text-anchor="middle" class="spec" fill="#14496b">UART + servo out</text>

    <!-- Buck Converter -->
    <rect x="210" y="240" width="140" height="115" rx="8" fill="#fef3e2" stroke="#e8871e" stroke-width="2"/>
    <text x="280" y="268" text-anchor="middle" class="label" fill="#8a4d0f" font-weight="700">Buck</text>
    <text x="280" y="284" text-anchor="middle" class="label" fill="#8a4d0f" font-weight="700">Converter</text>
    <text x="280" y="303" text-anchor="middle" class="spec" fill="#8a4d0f">12V → 5V</text>
    <text x="280" y="318" text-anchor="middle" class="spec" fill="#8a4d0f">Mini560 (3A)</text>
    <text x="280" y="333" text-anchor="middle" class="spec" fill="#8a4d0f">verify 5.0V out</text>

    <!-- ESP32 Onboard -->
    <rect x="35" y="385" width="315" height="140" rx="8" fill="#eef7ee" stroke="#2e933c" stroke-width="2.5"/>
    <text x="192" y="415" text-anchor="middle" class="label" fill="#175c22" font-weight="700">ESP32 #1 — Onboard Brain</text>
    <text x="192" y="432" text-anchor="middle" class="spec" fill="#175c22">gait CPG · sensor read · servo control</text>
    <text x="192" y="448" text-anchor="middle" class="spec" fill="#175c22">UART ↔ adapter · I2C/GPIO sensors</text>
    <text x="192" y="468" text-anchor="middle" class="spec" fill="#175c22">ESP-NOW radio ↔ Pi 5 (commands + telemetry)</text>
    <circle cx="65" cy="505" r="4" fill="#2e933c"/><text x="80" y="510" class="spec" fill="#175c22">GPIO17/16 (UART TX/RX)</text>
    <circle cx="65" cy="525" r="4" fill="#c9a227"/><text x="80" y="530" class="spec" fill="#175c22">3V3 (sensors)</text>

    <!-- MPU6050 IMU -->
    <rect x="35" y="550" width="145" height="100" rx="8" fill="#f0ecf9" stroke="#7d5ba6" stroke-width="2"/>
    <text x="107" y="575" text-anchor="middle" class="label" fill="#4b3572" font-weight="700">MPU6050 IMU</text>
    <text x="107" y="592" text-anchor="middle" class="spec" fill="#4b3572">GY-521 module</text>
    <text x="107" y="607" text-anchor="middle" class="spec" fill="#4b3572">I2C address 0x68</text>
    <text x="107" y="622" text-anchor="middle" class="spec" fill="#4b3572">GPIO21/22 (SDA/SCL)</text>
    <circle cx="65" cy="635" r="3" fill="#7d5ba6"/><text x="80" y="640" class="spec" fill="#4b3572">orientation feedback</text>

    <!-- HC-SR04P Ultrasonic -->
    <rect x="205" y="550" width="145" height="100" rx="8" fill="#f0ecf9" stroke="#7d5ba6" stroke-width="2"/>
    <text x="277" y="575" text-anchor="middle" class="label" fill="#4b3572" font-weight="700">HC-SR04P</text>
    <text x="277" y="592" text-anchor="middle" class="spec" fill="#4b3572">Ultrasonic sensor</text>
    <text x="277" y="607" text-anchor="middle" class="spec" fill="#4b3572">3.3V version (safe)</text>
    <text x="277" y="622" text-anchor="middle" class="spec" fill="#4b3572">GPIO26/27 (TRIG/ECHO)</text>
    <circle cx="235" cy="635" r="3" fill="#7d5ba6"/><text x="250" y="640" class="spec" fill="#4b3572">obstacle detection</text>

    <!-- Servo Chain Container -->
    <rect x="35" y="680" width="315" height="200" rx="8" fill="#e2f5f3" stroke="#17a398" stroke-width="2.5"/>
    <text x="192" y="710" text-anchor="middle" class="label" fill="#0e6b64" font-weight="700">Motor Network — Daisy Chain</text>
    <text x="192" y="727" text-anchor="middle" class="spec" fill="#0e6b64">10× Waveshare ST3215 · ID #1–#10</text>
    <text x="192" y="742" text-anchor="middle" class="spec" fill="#0e6b64">single 3-wire bus: +12V · GND · DATA</text>

    <!-- Motor ID circles -->
    <circle cx="55" cy="800" r="6" fill="#17a398" stroke="#0e6b64" stroke-width="1"/><text x="55" y="804" text-anchor="middle" class="spec" fill="#fff" font-weight="600">1</text>
    <circle cx="85" cy="800" r="6" fill="#17a398" stroke="#0e6b64" stroke-width="1"/><text x="85" y="804" text-anchor="middle" class="spec" fill="#fff" font-weight="600">2</text>
    <circle cx="115" cy="800" r="6" fill="#17a398" stroke="#0e6b64" stroke-width="1"/><text x="115" y="804" text-anchor="middle" class="spec" fill="#fff" font-weight="600">3</text>
    <circle cx="145" cy="800" r="6" fill="#17a398" stroke="#0e6b64" stroke-width="1"/><text x="145" y="804" text-anchor="middle" class="spec" fill="#fff" font-weight="600">4</text>
    <circle cx="175" cy="800" r="6" fill="#17a398" stroke="#0e6b64" stroke-width="1"/><text x="175" y="804" text-anchor="middle" class="spec" fill="#fff" font-weight="600">5</text>
    <circle cx="205" cy="800" r="6" fill="#17a398" stroke="#0e6b64" stroke-width="1"/><text x="205" y="804" text-anchor="middle" class="spec" fill="#fff" font-weight="600">6</text>
    <circle cx="235" cy="800" r="6" fill="#17a398" stroke="#0e6b64" stroke-width="1"/><text x="235" y="804" text-anchor="middle" class="spec" fill="#fff" font-weight="600">7</text>
    <circle cx="265" cy="800" r="6" fill="#17a398" stroke="#0e6b64" stroke-width="1"/><text x="265" y="804" text-anchor="middle" class="spec" fill="#fff" font-weight="600">8</text>
    <circle cx="295" cy="800" r="6" fill="#17a398" stroke="#0e6b64" stroke-width="1"/><text x="295" y="804" text-anchor="middle" class="spec" fill="#fff" font-weight="600">9</text>
    <circle cx="325" cy="800" r="6" fill="#17a398" stroke="#0e6b64" stroke-width="1"/><text x="325" y="804" text-anchor="middle" class="spec" fill="#fff" font-weight="600">10</text>

    <!-- Servo specs -->
    <text x="192" y="835" text-anchor="middle" class="spec" fill="#0e6b64">6–12.6V · 1 Mbps half-duplex TTL</text>
    <text x="192" y="850" text-anchor="middle" class="spec" fill="#0e6b64">stall 2.7A/servo · feedback: position, load, temp</text>
    <text x="192" y="865" text-anchor="middle" class="spec" fill="#0e6b64">±80° swing per joint · 58 mm pitch</text>
  </g>

  <!-- ============ BASE STATION SECTION ============ -->
  <g id="base-station">
    <!-- Background frame for base station -->
    <rect x="525" y="70" width="455" height="400" rx="12" fill="#f5f5f0" stroke="#c5c5d0" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="545" y="95" class="label" font-weight="700" fill="#6b6b7b">BASE STATION (SEPARATE)</text>

    <!-- Raspberry Pi 5 -->
    <rect x="545" y="115" width="190" height="130" rx="8" fill="#fdeef2" stroke="#c74f6d" stroke-width="2.5"/>
    <text x="640" y="145" text-anchor="middle" class="label" fill="#7c2140" font-weight="700">Raspberry Pi 5</text>
    <text x="640" y="162" text-anchor="middle" class="spec" fill="#7c2140">8GB RAM · Ubuntu/ROS</text>
    <text x="640" y="177" text-anchor="middle" class="spec" fill="#7c2140">controller UI · gait commands</text>
    <text x="640" y="192" text-anchor="middle" class="spec" fill="#7c2140">telemetry dashboard · SSH/web</text>
    <text x="640" y="210" text-anchor="middle" class="spec" fill="#7c2140">5V USB-C powered</text>

    <!-- ESP32 #2 Base Station -->
    <rect x="765" y="115" width="190" height="130" rx="8" fill="#eef7ee" stroke="#2e933c" stroke-width="2.5"/>
    <text x="860" y="145" text-anchor="middle" class="label" fill="#175c22" font-weight="700">ESP32 #2</text>
    <text x="860" y="162" text-anchor="middle" class="spec" fill="#175c22">Radio bridge</text>
    <text x="860" y="177" text-anchor="middle" class="spec" fill="#175c22">relays commands</text>
    <text x="860" y="192" text-anchor="middle" class="spec" fill="#175c22">receives telemetry</text>
    <text x="860" y="210" text-anchor="middle" class="spec" fill="#175c22">USB-powered from Pi</text>

    <!-- Legend Box -->
    <rect x="545" y="280" width="410" height="180" rx="8" fill="#fff" stroke="#c5c5d0" stroke-width="1.5"/>
    <text x="565" y="305" class="label" font-weight="700">Data Flow Legend</text>

    <line x1="575" y1="330" x2="615" y2="330" stroke="#d1495b" stroke-width="4"/>
    <text x="630" y="335" class="legend">Power (12V LiPo)</text>

    <line x1="575" y1="355" x2="615" y2="355" stroke="#e8871e" stroke-width="3"/>
    <text x="630" y="360" class="legend">Power (5V regulator out)</text>

    <line x1="575" y1="380" x2="615" y2="380" stroke="#2e933c" stroke-width="2.5"/>
    <text x="630" y="385" class="legend">UART control (1 Mbps)</text>

    <line x1="575" y1="405" x2="615" y2="405" stroke="#17a398" stroke-width="3"/>
    <text x="630" y="410" class="legend">Servo bus (power + data)</text>

    <line x1="575" y1="430" x2="615" y2="430" stroke="#7d5ba6" stroke-width="2.5" stroke-dasharray="4,3"/>
    <text x="630" y="435" class="legend">ESP-NOW wireless</text>
  </g>

  <!-- ============ CONNECTIONS (POWER) ============ -->
  <!-- Pack A → Driver -->
  <line x1="90" y1="215" x2="90" y2="240" stroke="#d1495b" stroke-width="4" marker-end="url(#arrowhead)"/>
  <text x="105" y="228" class="connection-label" fill="#8f1f30" font-weight="600">+12V</text>

  <!-- Pack B → Driver -->
  <line x1="215" y1="215" x2="160" y2="240" stroke="#d1495b" stroke-width="4" marker-end="url(#arrowhead)"/>
  <text x="165" y="228" class="connection-label" fill="#8f1f30" font-weight="600">+12V</text>

  <!-- Driver → Buck -->
  <line x1="185" y1="297" x2="210" y2="297" stroke="#d1495b" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="195" y="315" text-anchor="middle" class="connection-label" fill="#8f1f30" font-weight="600">12V tap</text>

  <!-- Buck → ESP32 -->
  <line x1="280" y1="355" x2="220" y2="385" stroke="#e8871e" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="235" y="375" class="connection-label" fill="#8a4d0f" font-weight="600">5V</text>

  <!-- Driver → Servo Chain -->
  <line x1="112" y1="355" x2="112" y2="680" stroke="#17a398" stroke-width="3.5" marker-end="url(#arrowhead)"/>
  <text x="75" y="520" class="connection-label" fill="#0e6b64" font-weight="600">+12V, GND, DATA</text>

  <!-- ============ CONNECTIONS (CONTROL) ============ -->
  <!-- Driver → ESP32 (UART) -->
  <line x1="112" y1="355" x2="140" y2="385" stroke="#2e933c" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="110" y="375" class="connection-label" fill="#175c22" font-weight="600">UART TX/RX</text>

  <!-- Sensors → ESP32 (I2C / GPIO) -->
  <polyline points="107,550 107,510 160,430" fill="none" stroke="#2274a5" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="95" y="480" class="connection-label" fill="#2274a5" font-weight="600">I2C / GPIO</text>

  <!-- Servo feedback (dashed) -->
  <line x1="192" y1="680" x2="220" y2="525" stroke="#17a398" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrowhead)"/>
  <text x="245" y="600" class="connection-label" fill="#0e6b64" font-weight="600">feedback</text>

  <!-- ============ CONNECTIONS (ESP-NOW WIRELESS) ============ -->
  <!-- ESP32 #1 → ESP32 #2 (diagonal wireless link) -->
  <polyline points="350,455 450,200 765,180" fill="none" stroke="#7d5ba6" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrowhead-wireless)"/>
  <text x="530" y="300" text-anchor="middle" class="connection-label" fill="#7d5ba6" font-weight="600">ESP-NOW (2.4 GHz)</text>
  <text x="530" y="318" text-anchor="middle" class="spec" fill="#7d5ba6">commands ↔ telemetry</text>

  <!-- Pi ↔ ESP32 #2 (USB) -->
  <line x1="735" y1="180" x2="765" y2="180" stroke="#555" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="750" y="170" text-anchor="middle" class="connection-label" fill="#444" font-weight="600">USB</text>

  <!-- ============ FOOTER ============ -->
  <rect x="20" y="895" width="960" height="40" rx="6" fill="#fffbe8" stroke="#d9c26b" stroke-width="1"/>
  <text x="50" y="920" class="legend" fill="#6b5a10">Power flow (solid red/orange) · Control flow (green/blue) · Wireless (purple dashed) · All grounds common · First power-up: packs → fuses → driver → buck confirm 5V → ESP32 → servos (one at a time)</text>
</svg>
