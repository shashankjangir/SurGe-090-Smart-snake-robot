; SURGE-090 — PlatformIO build config for the Gen 2 ESP32 firmware.
;
; The repo keeps one folder per sketch under gen2-st3215/firmware/, so each
; folder becomes its own environment. build_src_filter is what isolates them:
; without the leading -<*> PlatformIO compiles every folder into one binary
; and you get duplicate setup()/loop() errors.
;
; Build/upload one env:   pio run -e spin_all -t upload
; Serial monitor:         pio device monitor -e spin_all

[platformio]
src_dir = gen2-st3215/firmware

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; --- Bench bring-up -------------------------------------------------------

; Broadcast sweep. Runs with all servos still on factory ID 1.
[env:spin_all]
build_src_filter = -<*> +<spin_all/*>

; One servo at a time. send_on_enter so Serial.parseInt() gets a whole number.
[env:assign_ids]
build_src_filter = -<*> +<assign_ids/*>
monitor_filters = send_on_enter
monitor_eol = LF

; USB CDC <-> servo UART, for the Python stack in gen2-st3215/.
[env:usb_servo_bridge]
build_src_filter = -<*> +<usb_servo_bridge/*>

; --- Field ----------------------------------------------------------------

; Each field sketch has its own surge_protocol.h alongside its source, and the
; copies match. Change them all together — a mismatch silently breaks the
; ESP-NOW structs between robot and base.
; (24 Sep 2026: the old, drifted firmware/include/surge_protocol.h was deleted.)

[env:robot_esp32]
build_src_filter = -<*> +<robot_esp32/*>

; Field firmware v2 (split power bus v3): boots limp, soft start per power
; group, joint limits, low-battery/temperature stop. Flash this instead of
; robot_esp32.
[env:robot_esp32_v2]
build_src_filter = -<*> +<robot_esp32_v2/*>

[env:base_esp32]
build_src_filter = -<*> +<base_esp32/*>

; --- Gen 2.1 integrated control (dashboard / gamepad / ESP-NOW bridge) ----
; Flash libraries (SCServo, Adafruit OLED/NeoPixel/MPU/BMP) match the
; Waveshare / Arduino IDE setup used for the older receiver sketches.

; Planar receiver: HELLO/RUN/STOP, per-joint speed, torque watchdog.
[env:receiver_gen2_1]
build_src_filter = -<*> +<receiver_gen2_1/*>
lib_deps =
    workloads/SCServo@1.0.1
    adafruit/Adafruit SSD1306@2.5.13
    adafruit/Adafruit NeoPixel@1.12.3

[env:transmitter_gen2_1]
build_src_filter = -<*> +<transmitter_gen2_1/*>

[env:sensor_gen2_1]
build_src_filter = -<*> +<sensor_gen2_1/*>
lib_deps =
    adafruit/Adafruit SSD1306@2.5.13
    adafruit/Adafruit BMP280 Library@2.6.8
    adafruit/Adafruit MPU6050@2.2.6

[env:get_mac_oled]
build_src_filter = -<*> +<get_mac_oled/*>
lib_deps = adafruit/Adafruit SSD1306@2.5.13
