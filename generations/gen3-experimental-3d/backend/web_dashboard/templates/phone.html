<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>SURGE Controller</title>
  <link rel="stylesheet" href="/static/fonts/fonts.css?v={{ asset_v }}">
  <link rel="stylesheet" href="/static/phone.css?v={{ asset_v }}">
  <script src="/static/phone.js?v={{ asset_v }}" defer></script>
</head>
<body>
  <header class="strip">
    <span class="brand">SURGE-090</span>
    <span class="star" aria-hidden="true">✦</span>
    <span class="strip-title">Phone controller</span>
    <span id="link" class="link-chip" data-state="connecting" role="status">Connecting…</span>
    <button type="button" id="fullscreen" class="icon-btn" aria-label="Full screen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </header>

  <main class="deck">
    <section class="zone zone-left" aria-label="Start and steering">
      <button type="button" class="pad-btn btn-a" data-button="0" aria-label="A, start">
        <span class="glyph">A</span><span class="cap">Start</span>
      </button>
      <div class="stick" id="steer" role="application" aria-label="Steering stick">
        <span class="stick-label">Steer</span>
        <span class="knob"></span>
      </div>
    </section>

    <section class="zone zone-top" aria-label="Robot status">
      <div class="card status">
        <p class="eyebrow">Robot</p>
        <p id="run-state" class="run-state">Stopped</p>
        <p id="run-detail" class="run-detail">Waiting for the dashboard…</p>
        <form id="key-form" class="key-form" hidden>
          <label for="key-input">Pairing key from the laptop</label>
          <div class="key-row">
            <input id="key-input" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="32">
            <button type="submit" class="pill">Pair</button>
          </div>
        </form>
      </div>
      <button type="button" class="stop" id="stop" data-button="1" aria-label="B, stop">
        <span class="glyph">B</span> Stop
      </button>
    </section>

    <section class="zone zone-pad" aria-label="Gait tuning">
      <div class="dpad" aria-label="Amplitude">
        <button type="button" class="dir up" data-button="12" aria-label="Pitch up">▲</button>
        <button type="button" class="dir left" data-button="14" aria-label="Yaw down">◀</button>
        <span class="dpad-hub" aria-hidden="true"><span>Yaw ◀▶</span><span>Pitch ▲▼</span></span>
        <button type="button" class="dir right" data-button="15" aria-label="Yaw up">▶</button>
        <button type="button" class="dir down" data-button="13" aria-label="Pitch down">▼</button>
      </div>
      <div class="stick stick-sm" id="head" role="application" aria-label="Head inspection stick">
        <span class="stick-label">Head</span>
        <span class="knob"></span>
      </div>
    </section>

    <section class="zone zone-right" aria-label="Hold, throttle and gait buttons">
      <div class="face">
        <button type="button" class="pad-btn btn-x" data-button="2" aria-label="X, reverse">
          <span class="glyph">X</span><span class="cap">Reverse</span>
        </button>
        <button type="button" class="pad-btn btn-y" data-button="3" aria-label="Y, change shape">
          <span class="glyph">Y</span><span class="cap">Shape</span>
        </button>
      </div>
      <div class="hold" id="hold" role="slider" aria-label="Hold to run; slide up for speed" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <span class="hold-fill" id="hold-fill"></span>
        <span class="hold-text"><strong>Hold</strong><span id="hold-value">to run</span></span>
      </div>
    </section>
  </main>

  <p class="hint">Keep the dashboard focused on the laptop with <b>Enable Controller</b> on. Touch and hold <b>HOLD</b>, tap <b>A</b> to start, slide up for speed. Let go or press <b>Stop</b> to stop.</p>
</body>
</html>
